[project]
name = "ojt-guardrail"
version = "0.1.0"
description = "Guardrail service + reproducible evaluation harness for an internal LiteLLM proxy (generic_guardrail_api)"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pandas>=2.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
data = ["datasets>=2.19", "huggingface_hub>=0.23"]
hf = ["torch>=2.2", "transformers>=4.44"]
app = ["streamlit>=1.40", "plotly>=5.20"]   # interactive analysis: streamlit run src/analysis/app.py
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
