# Reproduces the current "SaaS / general LLM + prompt" approach inside the same harness, so it can be
# compared on identical data. Point base_url/model at the internal LLM (or the LiteLLM proxy itself).
_base_: [../default.yaml, _llm_stage_defaults.yaml]
run: {name: llm-judge-baseline}
pipeline:
  stages:
    - name: llm_judge
      type: openai_guard
      base_url: http://localhost:4000/v1
      api_key_env: LITELLM_API_KEY
      model: internal-llm
      max_model_len: 8192            # MUST equal vLLM --max-model-len (deploy/vllm/serve_guard.sh MAX_LEN)
      parser: json_policy
      prompt_mode: policy
      policy_file: src/config/server/policies/enterprise_policy.md
      json_mode: false                # set true if the backend supports response_format=json_object
      max_tokens: 128
      logprobs: true                  # if the backend returns logprobs we also get a score
      timeout: 30
      apply_to: [request, response]
      on_error: fail_open
