# Guardrail server base config. Model presets in models/*.yaml inherit this via `_base_`.
run:
  name: server
  output_dir: results/server        # resolved config snapshot of every server start lands here

server:
  host: 0.0.0.0
  port: 8080
  log_level: info
  api_key_env: GUARDRAIL_API_KEY    # must equal litellm_params.api_key (sent as x-api-key); unset = no auth
  log_text: false                   # never log prompt text by default (confidential data)
  expose_categories: true           # include categories in blocked_reason shown to users
  block_message: "此請求可能違反公司 AI 使用規範（{categories}），已被系統攔截。如認為誤判，請附上 request id {call_id} 聯繫 AI 平台團隊。"

env_passthrough: [GUARDRAIL_API_KEY, VLLM_API_KEY, HF_TOKEN]   # process env vars copied into config["envs"]

pipeline:
  strategy: sequential      # sequential: cheap stages first, stop at first block | parallel: all stages concurrently
  request_scope: last_user  # last_user | all_user | all_texts  (what is judged on pre_call)
  stages:
    # 1) deterministic rules: secrets / PII formats / internal codenames (rules_file kept out of git)
    - name: rules
      type: regex
      apply_to: [request, response]
      rules_file: src/config/server/policies/internal_rules.yaml   # optional; see internal_rules.example.yaml
      on_error: fail_open

    # 2) fast prompt-injection / jailbreak classifier (request only)
    - name: injection_clf
      type: hf_classifier
      enabled: false                 # enable once the model is downloaded to the box
      model: meta-llama/Llama-Prompt-Guard-2-86M
      device: cuda
      dtype: float16
      threshold: 0.5
      unsafe_labels: [MALICIOUS, LABEL_1]
      category: prompt_injection
      max_length: 512
      apply_to: [request]
      on_error: fail_open

    # 3) LLM guard on the MIG slice (vLLM, OpenAI-compatible)
    - name: llm_guard
      type: openai_guard
      base_url: http://localhost:8000/v1
      api_key_env: VLLM_API_KEY
      model: Qwen/Qwen3Guard-Gen-4B
      max_model_len: 8192            # MUST equal vLLM --max-model-len (deploy/vllm/serve_guard.sh MAX_LEN)
      parser: qwen3guard
      parser_options:
        controversial_as_unsafe: true
        ignore_categories: ["Politically Sensitive Topics"]
      prompt_mode: chat_template
      context_turns: 4
      max_tokens: 32
      temperature: 0.0
      logprobs: true
      top_logprobs: 5
      threshold: 0.5
      timeout: 10
      retries: 1
      apply_to: [request, response]
      on_error: fail_open            # availability first; flip to fail_closed for high-risk routes
