# Evaluation base config. Anything here can be overridden by CLI args or `--set key=value`.
run:
  name: eval
  seed: 42
  output_dir: results

env_passthrough: [GUARDRAIL_API_KEY, GUARDRAIL_SERVER_URL, GUARD_MODEL_BASE_URL, VLLM_API_KEY, HF_TOKEN,
                  MODEL_BASE_URL, MODEL_API_KEY, JUDGE_BASE_URL, JUDGE_API_KEY,
                  GUARDRAIL_SERVICE_URL, GUARDRAIL_SERVICE_API_KEY, LITELLM_BASE_URL, LITELLM_API_KEY]

task:
  type: guardrail            # guardrail | model_safety | refusal_judge   (python -m src.evaluation --list)

data:
  # CSV files with exactly two columns: prompt,expected (block | pass | mask). The file name is the source.
  files:                      # CSV paths, globs or directories (a mix directory = every *.csv in it)
    - processed_data/mixes/core_v1/
  max_samples_per_file: null  # null = all rows
  sampling: stratified        # stratified (by expected) | balanced | random | head
  expected: null              # e.g. [block, pass]
  languages: null             # detected from the prompt, e.g. [zh-TW, en]
  sources: null               # file names, e.g. [aegis2, xstest]
  # duplicates (same sample_id) are always dropped: predictions are keyed by sample_id

target:
  type: guardrail_server      # guardrail_server (this repo's server) | http_guardrail (any service) | inprocess
  guardrail_server:
    base_url: null            # explicit URL (--server-url) wins over base_url_env, which wins over default_base_url
    base_url_env: GUARDRAIL_SERVER_URL
    default_base_url: http://localhost:8080
    api_key_env: GUARDRAIL_API_KEY    # sent as x-api-key
    endpoint: classify        # classify: /v1/classify, per-stage verdicts + scores (model / threshold analysis)
                              # guardrail_api: the production endpoint, decision only (what production returns)
    run_all: true             # classify: run every stage (no short-circuit) -> per-stage metrics
    stages: null              # classify: restrict to these stage names
    canary: true              # a known injection must be BLOCKED at startup, else abort (wrong config / fail-open)
  http_guardrail:             # any guardrail service, through an adapter (see guardrail_service.yaml)
    adapter: {type: generic_guardrail_api}   # the service speaks the LiteLLM generic guardrail API
    base_url: null            # --service-url
    base_url_env: GUARDRAIL_SERVICE_URL
    api_key_env: GUARDRAIL_SERVICE_API_KEY
    input_type: request       # request: judge the prompt | response: judge the `response` column
    canary: true
    info_path: null           # e.g. /v1/info: the service's self-description, stored with the run (start + end)
    info_required: false      # true: abort when the info cannot be read
  inprocess:
    server_config: [src/config/server/default.yaml]
    overrides: []             # dotted overrides applied to the server config
    run_all: true

eval:
  concurrency: 16
  timeout: 60
  retries: 3
  error_policy: exclude       # exclude | as_safe (= fail_open) | as_unsafe (= fail_closed)
  stage_errors: retry         # a guard stage that errored makes the row an error (retried) instead of a silent fail-open
  save_raw: true
  limit: null

metrics:
  threshold: null             # null: use the target's decision; float: re-threshold the score
  score_stage: null           # stage whose score is re-thresholded / used for ROC (e.g. llm_guard); other
                              # stages keep their hard decisions. null = pipeline score (max over stages)
  bootstrap: 1000
  ci: 0.95
  fpr_targets: [0.01, 0.05]
  slice_by: [source, language]
  min_slice_size: 1

report:
  n_error_examples: 200
