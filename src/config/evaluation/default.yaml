# Evaluation base config. Anything here can be overridden by CLI args or `--set key=value`.
run:
  name: eval
  seed: 42
  output_dir: results

env_passthrough: [GUARDRAIL_API_KEY, VLLM_API_KEY, LITELLM_API_KEY, LITELLM_BASE_URL, GUARDRAIL_SERVER_URL, HF_TOKEN]

data:
  files:                      # processed CSVs or globs (relative to repo root)
    - processed_data/mixes/core_v1.csv
  max_samples_per_file: null  # null = all rows
  sampling: stratified        # stratified | balanced | random | head
  input_types: [request, response]
  languages: null             # e.g. [zh-TW, en]
  sources: null
  dedupe: true

target:
  type: inprocess             # inprocess | guardrail_server | litellm_apply_guardrail | litellm_chat
  inprocess:
    server_config: [src/config/server/default.yaml]
    overrides: []             # dotted overrides applied to the server config
    run_all: true             # evaluate every stage (no short-circuit) -> per-stage metrics
  guardrail_server:
    base_url: http://localhost:8080
    base_url_env: GUARDRAIL_SERVER_URL
    api_key_env: GUARDRAIL_API_KEY
    run_all: true
    stages: null
  litellm:
    base_url: http://localhost:4000
    base_url_env: LITELLM_BASE_URL
    api_key_env: LITELLM_API_KEY
    guardrail_name: ojt-guard-pre           # for litellm_apply_guardrail (request rows)
    response_guardrail_name: ojt-guard-post # for litellm_apply_guardrail (response rows)
    request_guardrails: [ojt-guard-pre]     # for litellm_chat
    response_guardrails: [ojt-guard-post]
    model: internal-llm                     # any model alias on the proxy (response rows use mock_response)
    max_tokens: 1
    blocked_status_codes: [400]
    blocked_markers: [guardrail, blocked, violat, 攔截]

eval:
  concurrency: 16
  timeout: 60
  retries: 3
  error_policy: exclude       # exclude | as_safe (fail-open) | as_unsafe (fail-closed)
  save_raw: true
  limit: null

metrics:
  threshold: null             # null: use the target's decision; float: re-threshold the pipeline score
  bootstrap: 1000
  ci: 0.95
  fpr_targets: [0.01, 0.05]
  slice_by: [source, language, input_type, attack_type]
  min_slice_size: 1

report:
  n_error_examples: 200
