# Data pipeline config:  python -m src.converters --config src/config/data.yaml
#                        python -m src.converters.mix --config src/config/data.yaml
# Every entry -> processed_data/<name>.csv (two columns: prompt,expected with expected = block | pass | mask)
#               + processed_data/<name>.manifest.json (provenance, sha256, counts, row accounting).
# Only the request side (the prompt) is converted; the file name is the source name.
# `revision`: pin the HF commit sha once you have picked a version (several repos changed in 2026).
# `license` matters: NC = non-commercial -> ask legal before using even for internal evaluation.
raw_dir: data/raw
processed_dir: processed_data

datasets:
  # ---------------- content safety: harmful prompt -> block, benign -> pass ----------------
  aegis2: {splits: [test]}                                   # CC-BY-4.0, human prompt labels, en
  nemotron_safety_v3_zh: {converter: nemotron_safety_v3, languages: [zh], splits: [test]}          # zh-CN
  nemotron_safety_v3_zhtw: {converter: nemotron_safety_v3, languages: [zh], splits: [test], opencc: s2twp}  # machine zh-TW
  polyguard_prompts: {languages: [Chinese, English]}         # CC-BY-4.0, WildGuardTest translated
  wildguardtest: {enabled: false}                            # gated (AI2 form) -> enable after access
  toxic_chat: {enabled: false}                               # CC-BY-NC-4.0 -> legal review first
  openai_moderation: {}
  chinesesafe: {enabled: false}                              # CC-BY-NC-4.0, noisy; political subject auto-dropped

  # ---------------- prompt injection / jailbreak: attack -> block, benign -> pass ----------------
  # Injection-axis labels only (label 0 = "not an injection" -> pass, incl. plain harmful requests). Its xstest /
  # orbench_hard / notinject configs are NOT in the class defaults: they contradict the content-safety labels
  # of our xstest / or_bench / notinject converters (same prompt pass here, block there -> a cross-source conflict).
  # Add them with `configs: [...]` only for an injection-only eval that does not also contain those converters.
  pi_eval_suite: {}                                          # direct + jailbreak + indirect (deepset/jackhhao/boundary/neuralchemy/bipia/piarena/llmail)
  # The three sets in current use. deepset / neuralchemy are ALSO inside pi_eval_suite (deepset_test, neuralchemy_test):
  # use either these entries or pi_eval_suite in one eval, not both (the same prompts would count twice).
  # Quality notes and which rows to drop: docs/prompt_injection_data.md §1.
  deepset_prompt_injections: {enabled: false}                # 116 test rows, en/de, noisy positives -> sanity check
  neuralchemy_pi: {enabled: false}                           # `core` test, 942 rows, en
  eric12132_pi_en: {enabled: false, converter: eric12132_pi, text_column: prompt}                 # 91 test rows; CC-BY-NC upstream
  eric12132_pi_zhtw: {enabled: false, converter: eric12132_pi, text_column: taiwan_translation}   # machine zh-TW, ~29% broken positives
  boundary_pairs: {}                                         # benign/attack minimal pairs
  notinject: {}                                              # over-defense FPR (all pass)
  # `sample` = seeded, stratified by expected (keeps the ~9% jailbreak base rate). Not `limit`: it stops after N rows,
  # i.e. every jailbreak_* row + the first regular_* rows in file order. `strategy: balanced` keeps all ~1.4k jailbreaks.
  in_the_wild_jailbreak: {date: "2023_12_25", sample: {n: 3000, seed: 42, strategy: stratified}}
  jbb_behaviors: {}
  harmbench: {}                                              # all block (recall)

  # ---------------- over-refusal / multilingual ----------------
  xstest: {}                                                 # 250 look-unsafe prompts -> pass, 200 contrasts -> block
  or_bench: {}
  multijail_zhtw: {converter: multijail, languages: [zh], opencc: s2twp}   # all block (recall)
  rtp_lx: {locales: [ZH_Hant, ZH_Hans, EN], threshold: 3.0}  # ODC-BY
  # NATIVE zh-TW: the ZH_Hant file only. Selected by file, not by detection (a short Traditional prompt without
  # script-marker characters is detected as plain `zh`).
  rtp_lx_zhtw: {converter: rtp_lx, locales: [ZH_Hant], threshold: 3.0}
  # TS-Bench (400 human-curated Taiwanese-Mandarin prompts, GitHub mtkresearch/TS-Bench, licence unverified):
  # download, check licence, then load with converter: local_file

  # ---------------- PII / secrets: prompt with in-policy spans -> mask, clean -> pass ----------------
  # `pii_expected: block` for a policy that rejects PII instead of masking it.
  tw_pii_bench: {ignore_labels: [private_date]}
  seatbelt_pii_heldout: {}

  # ---------------- internal (never commit the raw files) ----------------
  internal_redteam:
    enabled: false
    converter: local_file
    path: data/raw/internal_redteam.jsonl
    columns: {prompt: prompt, label: label}
    label_map: {"1": block, "0": pass}
  saas_baseline_log:                                         # labelled samples from the current SaaS + prompt setup
    enabled: false
    converter: local_file
    path: data/raw/saas_labelled.csv
    columns: {prompt: input, label: human_label}
    label_map: {"1": block, "0": pass, pii: mask}

# Frozen evaluation mixes -> processed_data/mixes/<mix>/<source>.csv + manifest.json (one CSV per source).
# Bump the version instead of editing a released mix. `filter: {language: [...]}` matches the language detected
# from the prompt at mix time; `filter: {expected: [...]}` the expected value.
# core_v1's pi_eval_suite part no longer contains the suite's xstest / orbench_hard / notinject configs (see above):
# xstest, or_bench and notinject enter only through their own converters, with content-safety labels.
mixes:
  core_v1:
    seed: 42
    parts:
      - {file: processed_data/aegis2.csv, n: 1200}
      - {file: processed_data/polyguard_prompts.csv, n: 1200, filter: {language: [zh-CN]}}
      - {file: processed_data/nemotron_safety_v3_zhtw.csv, n: 800}
      - {file: processed_data/pi_eval_suite.csv, n: 1500}
      - {file: processed_data/boundary_pairs.csv}
      - {file: processed_data/notinject.csv}
      - {file: processed_data/xstest.csv}
      - {file: processed_data/or_bench.csv, n: 600}
  zhtw_v1:                                                   # zh-TW focused; replace machine-converted parts with human-reviewed data ASAP
    seed: 42
    parts:
      - {file: processed_data/rtp_lx_zhtw.csv}                       # native Traditional Chinese (ZH_Hant file)
      - {file: processed_data/nemotron_safety_v3_zhtw.csv, n: 1500}
      - {file: processed_data/multijail_zhtw.csv}
      - {file: processed_data/tw_pii_bench.csv}
