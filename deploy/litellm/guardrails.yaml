# Desired guardrails on the LiteLLM proxy, applied through the admin API (no config-file access needed):
#   python -m src.litellm_admin plan          # diff
#   python -m src.litellm_admin apply --yes   # create/update
#
# Secrets: `env:NAME` is resolved locally from .env and sent to the proxy (stored in its DB, masked on read).
#          `os.environ/NAME` is passed through and resolved on the proxy pods (only api_key / api_base,
#          and only if that env var exists on every pod).
# Only guardrails with guardrail_info.managed_by == managed_by are touched by apply/prune.
managed_by: ojt-guardrail

guardrails:
  # Input guard. Start with default_on: false and attach to a pilot team (`attach --team ...`),
  # then flip to true once the eval + shadow numbers are acceptable.
  - guardrail_name: ojt-guard-pre
    litellm_params:
      guardrail: generic_guardrail_api
      mode: pre_call
      api_base: env:OJT_GUARDRAIL_API_BASE          # e.g. http://guardrail-svc.ai-infra:8080
      api_key: env:OJT_GUARDRAIL_API_KEY            # == GUARDRAIL_API_KEY of the guardrail service
      default_on: false
      unreachable_fallback: fail_open
      fail_on_error: true
      skip_system_message_in_guardrail: true
      additional_provider_specific_params: {policy: enterprise_v1}
    guardrail_info:
      description: "OJT input guard (rules -> PI classifier -> LLM guard)"
      owner: ai-infra

  # Output guard
  - guardrail_name: ojt-guard-post
    litellm_params:
      guardrail: generic_guardrail_api
      mode: post_call
      api_base: env:OJT_GUARDRAIL_API_BASE
      api_key: env:OJT_GUARDRAIL_API_KEY
      default_on: false
      unreachable_fallback: fail_open
      streaming_end_of_stream_only: false
      streaming_sampling_rate: 5
    guardrail_info:
      description: "OJT output guard"
      owner: ai-infra

  # Candidate model behind a second service instance, opt-in per request/key/team for A/B.
  - guardrail_name: ojt-guard-pre-candidate
    litellm_params:
      guardrail: generic_guardrail_api
      mode: pre_call
      api_base: env:OJT_GUARDRAIL_CANDIDATE_API_BASE
      api_key: env:OJT_GUARDRAIL_API_KEY
      default_on: false
      unreachable_fallback: fail_open
    guardrail_info:
      description: "OJT input guard — candidate model (A/B)"
      owner: ai-infra
